    <circle cx="150" cy="172" r="62" fill="url(#planet1)"/>
    <circle cx="128" cy="150" r="10" fill="#f5d0fe" opacity="0.35"/>
    <circle cx="172" cy="190" r="16" fill="#3b0764" opacity="0.45"/>
