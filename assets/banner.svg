<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="MS Web Cyber - AI Agents, Android, Cybersecurity">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07020f"/>
      <stop offset="0.55" stop-color="#150726"/>
      <stop offset="1" stop-color="#0b0416"/>
    </linearGradient>

    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5d0fe"/>
      <stop offset="0.45" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <radialGradient id="planet1" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#3b0764"/>
    </radialGradient>

    <radialGradient id="planet2" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#083344"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#a855f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>

    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>

  <circle cx="220" cy="130" r="170" fill="#7c3aed" opacity="0.32" filter="url(#soft)"/>
  <circle cx="1080" cy="150" r="160" fill="#0891b2" opacity="0.26" filter="url(#soft)"/>
  <circle cx="640" cy="20" r="140" fill="#db2777" opacity="0.10" filter="url(#soft)"/>

  <g fill="#e9d5ff">
